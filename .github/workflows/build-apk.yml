name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

env:
  PROJECT_DIR: buildsrc/GrupoIdea-Aberturas-Android-v1.0.0
  APK_NAME: GrupoIdea-Aberturas-v1.0.0-debug.apk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Android source
        run: |
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q source-android-v1.0.0.zip -d buildsrc
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" "$APK_NAME"
          sha256sum "$APK_NAME" | tee "$APK_NAME.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrupoIdea-Aberturas-v1.0.0-debug
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 30
